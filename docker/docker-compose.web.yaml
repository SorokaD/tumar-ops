# ============================================
# Public website: tumar.tech (Next.js)
# ============================================
# Usage (from the existing ops checkout on the server — do not rename that folder):
#   docker compose -f docker/docker-compose.web.yaml --env-file .env up -d --build
#
# Pre-requisites:
#   1. Network 'web' exists: docker network create web
#   2. Traefik is running
#   3. Site source cloned as a *sibling* of this ops repo, folder name tumar-web:
#        git clone https://github.com/SorokaD/okx-hft-tumar-web.git tumar-web
#      Then TUMAR_WEB_PATH=../../tumar-web (relative to this compose file).
#      Prefer an absolute path in .env, e.g. /opt/hft/tumar-web
#   4. DNS A-record: tumar.tech -> this VPS
#      Wildcard *.tumar.tech does NOT cover the apex domain.
# ============================================

services:
  tumar-web:
    build:
      context: ${TUMAR_WEB_PATH:-../../tumar-web}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tumar.tech}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com/SorokaD}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_SUPERSET_PUBLIC_URL: ${NEXT_PUBLIC_SUPERSET_PUBLIC_URL:-}
    image: tumar-web:latest
    container_name: tumar-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tumar.tech}
      NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com/SorokaD}
      NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_SUPERSET_PUBLIC_URL: ${NEXT_PUBLIC_SUPERSET_PUBLIC_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M
    labels:
      - "logging=promtail"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.tumar-web.rule=Host(`tumar.tech`)"
      - "traefik.http.routers.tumar-web.entrypoints=websecure"
      - "traefik.http.routers.tumar-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.tumar-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.tumar-web.middlewares=tumar-web-security"
      - "traefik.http.middlewares.tumar-web-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tumar-web-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.tumar-web-security.headers.stsPreload=true"
      - "traefik.http.middlewares.tumar-web-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.tumar-web-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tumar-web-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.tumar-web-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.tumar-web-security.headers.customFrameOptionsValue=SAMEORIGIN"
    networks:
      - web

networks:
  web:
    external: true
